[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-cataloger"
version = "0.1.0"
description = "Catalog every image in a folder with a one-line AI description, resumably and in parallel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "Pillow>=10.0",
    "keyring>=24",
    "PySide6>=6.6",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.13"]
dev = ["pytest>=7"]

[project.scripts]
image-cataloger = "image_cataloger.gui.app:main"
image-cataloger-cli = "image_cataloger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
